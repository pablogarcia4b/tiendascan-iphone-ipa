name: TiendaScan
options:
  bundleIdPrefix: com.esquipa
  deploymentTarget:
    iOS: "17.0"
targets:
  TiendaScan:
    type: application
    platform: iOS
    sources:
      - TiendaScan
    info:
      path: TiendaScan/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esquipa.tiendascan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
